# Runs the test suite with the REAL OpenTelemetry SDK, plus the demo, the attacks and the example.
# Action versions below are from memory: verify them against the current releases.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - run: python examples/quickstart.py
      - run: python -m demo.run_all
      - run: python -m attacks.tamper
